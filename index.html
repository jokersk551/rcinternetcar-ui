<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta charset="utf-8">
<title>RC Internet Car</title>

<style>
  html,body{
    height:100%; margin:0; background:#000; color:#fff;
    font-family:Arial; user-select:none; touch-action:none;
  }
  .wrap{
    height:100vh; display:flex; justify-content:space-between;
    align-items:center; padding:20px; box-sizing:border-box;
  }
  .col{
    display:flex; flex-direction:column; gap:30px; align-items:center;
  }
  .btn{
    width:160px; height:120px;
    border:3px solid #fff; border-radius:12px;
    background:#111; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
  }
  .btn:active{ background:#fff; color:#000 }
  .status{ position:fixed; left:8px; bottom:8px; font-size:13px; color:#aaa }
</style>
</head>

<body>

<div class="wrap">

  <div class="col">
    <div id="UP" class="btn">UP</div>
    <div id="DOWN" class="btn">DOWN</div>
  </div>

  <div class="col">
    <div id="LEFT" class="btn">LEFT</div>
    <div id="RIGHT" class="btn">RIGHT</div>
  </div>

</div>

<div id="status" class="status">Connecting…</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// ==== YOUR FIREBASE CONFIG (USE THE CORRECT ONE) ====
var firebaseConfig = {
  apiKey: "AIzaSyBHrnh8l6BFX-zQeB3XhkOYnTflY-s5pPw",
  authDomain: "rcinternetcar.firebaseapp.com",
  databaseURL: "https://rcinternetcar-default-rtdb.firebaseio.com",
  projectId: "rcinternetcar",
  storageBucket: "rcinternetcar.firebasestorage.app",
  messagingSenderId: "759617467760",
  appId: "1:759617467760:web:51bbd27f63a410ba708bb5"
};
// ====================================================

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var statusEl = document.getElementById("status");

var S = { up:0, down:0, left:0, right:0 };

/* Connection indicator */
firebase.database().ref(".info/connected").on("value", snap=>{
  statusEl.textContent = snap.val() ? "Connected" : "Disconnected";
});

/* Multi-touch button binding */
function bind(id, key){
  let el = document.getElementById(id);

  el.addEventListener("pointerdown", e=>{
    e.preventDefault();
    S[key] = 1;
    update();
  }, {passive:false});

  el.addEventListener("pointerup", e=>{
    e.preventDefault();
    S[key] = 0;
    update();
  }, {passive:false});

  el.addEventListener("pointerleave", e=>{
    e.preventDefault();
    S[key] = 0;
    update();
  }, {passive:false});
}

/* Attach buttons */
bind("UP","up");
bind("DOWN","down");
bind("LEFT","left");
bind("RIGHT","right");

/* Send ALL states together */
function update(){
  db.ref("car").set({
    up: S.up,
    down: S.down,
    left: S.left,
    right: S.right,
    ts: Date.now()
  });
}

/* Optional keepalive */
setInterval(()=> db.ref("car/ts").set(Date.now()), 3000);

/* Prevent long press menu */
document.addEventListener("contextmenu", e=> e.preventDefault());

</script>
</body>
</html>
