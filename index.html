<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta charset="utf-8">

<style>
  body{
    margin:0; background:#000; color:#fff; font-family:Arial;
    user-select:none; touch-action:none;
  }

  .wrap{
    height:100vh; display:flex;
    justify-content:space-around; align-items:center;
  }

  .col{
    display:flex; flex-direction:column;
    gap:40px; align-items:center;
  }

  .btn{
    width:160px; height:120px;
    border:3px solid #fff; background:#111;
    color:#fff; font-size:28px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    transition:0.1s;
  }
  .btn:active{ background:#fff; color:#000; }

  .disabled{
    opacity:0.4;
    pointer-events:none;
  }

  #status{
    position:fixed; bottom:10px; left:10px;
    font-size:15px;
  }
</style>
</head>

<body>

<div class="wrap">
  <div class="col">
    <div id="UP" class="btn">UP</div>
    <div id="DOWN" class="btn">DOWN</div>
  </div>

  <div class="col">
    <div id="LEFT" class="btn">LEFT</div>
    <div id="RIGHT" class="btn">RIGHT</div>
  </div>
</div>

<div id="status">Checking ESP...</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// ----------------------------------
// Firebase Config
// ----------------------------------
firebase.initializeApp({
  apiKey: "AIzaSyBHrnh8l6BFX-zQeB3XhkOYnTflY-s5pPw",
  authDomain: "rcinternetcar.firebaseapp.com",
  databaseURL: "https://rcinternetcar-default-rtdb.firebaseio.com",
  projectId: "rcinternetcar",
  storageBucket: "rcinternetcar.appspot.com",
  messagingSenderId: "759617467760",
  appId: "1:759617467760:web:51bbd27f63a410ba708bb5"
});

var db = firebase.database();

var S = { up:0, down:0, left:0, right:0 };

// ----------------------------------
// Update Firebase
// ----------------------------------
function updateDB(){
  db.ref("car").update({
    up:S.up,
    down:S.down,
    left:S.left,
    right:S.right,
    ts:Date.now()
  });
}

// ----------------------------------
// Multi-touch button binding
// ----------------------------------
function bind(id, key){
  let el = document.getElementById(id);

  el.addEventListener("pointerdown", e=>{
    e.preventDefault();
    S[key] = 1;
    updateDB();
  }, {passive:false});

  el.addEventListener("pointerup", e=>{
    e.preventDefault();
    S[key] = 0;
    updateDB();
  }, {passive:false});

  el.addEventListener("pointerleave", e=>{
    e.preventDefault();
    S[key] = 0;
    updateDB();
  }, {passive:false});
}

bind("UP","up");
bind("DOWN","down");
bind("LEFT","left");
bind("RIGHT","right");

document.addEventListener("contextmenu", e=>e.preventDefault());

// ----------------------------------
// ESP ONLINE CHECK (heartbeat)
// ----------------------------------
function setButtons(enable){
  ["UP","DOWN","LEFT","RIGHT"].forEach(id=>{
    let el = document.getElementById(id);
    if(enable) el.classList.remove("disabled");
    else el.classList.add("disabled");
  });
}

function checkESP(){
  db.ref("esp/online").once("value").then(snap=>{
    let ts = Number(snap.val());
    if(!ts){
      setButtons(false);
      status.textContent = "ESP: OFFLINE";
      return;
    }

    let now = Math.floor(Date.now()/1000);

    if(now - ts < 4){
      status.textContent = "ESP: ONLINE";
      setButtons(true);
    } else {
      status.textContent = "ESP: OFFLINE";
      setButtons(false);
    }

  });
}

setInterval(checkESP, 1000);
checkESP();

</script>
</body>
</html>
