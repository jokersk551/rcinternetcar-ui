<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta charset="utf-8">
<title>RC Internet Car</title>

<style>
body{
  margin:0; background:#000; color:#fff; font-family:Arial;
  user-select:none; touch-action:none;
}

.wrap{
  height:100vh; display:flex;
  justify-content:space-around; align-items:center;
}

.col{
  display:flex; flex-direction:column;
  gap:40px; align-items:center;
}

.btn{
  width:160px; height:120px;
  border:3px solid #fff; background:#111;
  color:#fff; font-size:28px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  opacity:1; transition:0.3s;
}

.btn.disabled{
  opacity:0.3;
  pointer-events:none;
}

.btn:active{
  background:#fff; color:#000;
}

#online{
  position:fixed; bottom:10px; left:10px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="col">
    <div id="UP" class="btn">UP</div>
    <div id="DOWN" class="btn">DOWN</div>
  </div>

  <div class="col">
    <div id="LEFT" class="btn">LEFT</div>
    <div id="RIGHT" class="btn">RIGHT</div>
  </div>
</div>

<div id="online">ESP: OFFLINE</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBHrnh8l6BFX-zQeB3XhkOYnTflY-s5pPw",
  authDomain: "rcinternetcar.firebaseapp.com",
  databaseURL: "https://rcinternetcar-default-rtdb.firebaseio.com",
  projectId: "rcinternetcar",
  storageBucket: "rcinternetcar.appspot.com",
  messagingSenderId: "759617467760",
  appId: "1:759617467760:web:51bbd27f63a410ba708bb5"
});

var db = firebase.database();
var S = { up:0, down:0, left:0, right:0 };

// BUTTON ENABLE/DISABLE
let buttons = [
  document.getElementById("UP"),
  document.getElementById("DOWN"),
  document.getElementById("LEFT"),
  document.getElementById("RIGHT")
];

function setButtonsEnabled(state){
  buttons.forEach(btn=>{
    if(state){
      btn.classList.remove("disabled");
    } else {
      btn.classList.add("disabled");
    }
  });
}

function updateDB(){
  db.ref('car').update({
    up:S.up, down:S.down, left:S.left, right:S.right,
    ts: Date.now()
  });
}

// multi-touch
function bind(id, key){
  let el = document.getElementById(id);

  el.addEventListener("pointerdown", e=>{
    e.preventDefault();
    S[key] = 1;
    updateDB();
  }, {passive:false});

  el.addEventListener("pointerup", e=>{
    e.preventDefault();
    S[key] = 0;
    updateDB();
  }, {passive:false});

  el.addEventListener("pointerleave", e=>{
    e.preventDefault();
    S[key] = 0;
    updateDB();
  }, {passive:false});
}

bind("UP","up");
bind("DOWN","down");
bind("LEFT","left");
bind("RIGHT","right");

let onlineEl = document.getElementById("online");

// ESP ONLINE CHECK
db.ref("esp/online").on("value", snap=>{
  let v = snap.val() || 0;

  if(Date.now() - v < 4000){
    onlineEl.innerText = "ESP: ONLINE";
    onlineEl.style.color = "#00ff00";

    // enable buttons
    setButtonsEnabled(true);

  } else {
    onlineEl.innerText = "ESP: OFFLINE";
    onlineEl.style.color = "red";

    // disable buttons instantly
    setButtonsEnabled(false);

    // make sure DB also stops sending movement
    S = { up:0, down:0, left:0, right:0 };
    updateDB();
  }
});

// disable long-press menu
document.addEventListener("contextmenu", e=>e.preventDefault());
</script>

</body>
</html>
